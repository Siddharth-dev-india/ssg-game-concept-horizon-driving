<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DevForge Horizon Drive</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101c;color:white;font-family:system-ui,Arial}#game{position:fixed;inset:0}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#06101c99,transparent 25%,transparent 65%,#06101caa)}.top{display:flex;justify-content:space-between;padding:16px 22px;align-items:flex-start}.logo{font-weight:900;letter-spacing:3px;text-shadow:0 0 18px #00d9ff}.pill{background:#071827bb;border:1px solid #56e6ff66;border-radius:12px;padding:8px 13px;font-size:12px}.speed{position:absolute;right:22px;bottom:20px;text-align:right}.speed b{font-size:clamp(48px,10vw,90px);line-height:.9;font-weight:900;text-shadow:0 0 20px #00dfff}.speed small{letter-spacing:3px;color:#a7eaff}.leftstats{position:absolute;left:22px;bottom:25px;display:grid;gap:9px}.stat{background:#071827bb;border:1px solid #56e6ff55;border-radius:10px;padding:9px 13px;min-width:120px}.stat strong{color:#7eeeff}.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px;pointer-events:auto}.ctrl{width:62px;height:62px;border-radius:50%;border:1px solid #9cecffaa;background:#071b2dbb;color:#fff;font-size:23px;touch-action:none;backdrop-filter:blur(8px)}.ctrl:active{background:#00bce977}.rightcontrols{position:absolute;right:18px;bottom:105px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}.ctrl.boost{width:76px;height:76px;color:#ffe45e;font-size:13px;font-weight:900;border-color:#ffe45e}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#03101ddd,#071b2bcf);pointer-events:auto}.panel{width:min(92vw,520px);padding:30px;border:1px solid #43e8ff77;border-radius:20px;background:#061725ee;box-shadow:0 0 60px #00bfff22;text-align:center}.panel h1{font-size:clamp(28px,7vw,50px);margin:0;background:linear-gradient(90deg,#fff,#63efff);-webkit-background-clip:text;color:transparent}.panel p{color:#a9cbd6}.start{padding:15px 30px;border:0;border-radius:12px;background:linear-gradient(90deg,#00b9e8,#5468ff);color:white;font-weight:900;letter-spacing:2px;font-size:16px}.hint{font-size:12px;color:#9bb5c3}.hidden{display:none!important}@media(max-width:700px){.top{padding:10px}.leftstats{bottom:95px;left:10px}.speed{bottom:12px;right:10px}.controls{bottom:14px;left:37%;gap:8px}.ctrl{width:53px;height:53px}.rightcontrols{right:10px;bottom:85px}.pill{padding:6px 9px}.stat{min-width:92px;padding:6px 8px;font-size:11px}}
</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="logo">DEVFORGE <span style="color:#67eaff">HORIZON DRIVE</span></div><div class="pill">FREE DRIVE · <span id="clock">00:00</span></div></div><div class="leftstats"><div class="stat">DISTANCE <strong id="distance">0.0 km</strong></div><div class="stat">NITRO <strong id="nitroTxt">100%</strong><div style="height:5px;background:#203847;margin-top:5px;border-radius:5px"><div id="nitroBar" style="height:100%;width:100%;background:#ffe45e;border-radius:5px"></div></div></div></div><div class="speed"><b id="speed">000</b><br><small>KM/H</small></div><div class="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="rightcontrols"><button class="ctrl" id="brake">▼<br><small style="font-size:9px">BRAKE</small></button><button class="ctrl boost" id="boost">NITRO</button></div></div><div class="overlay" id="start"><div class="panel"><h1>HORIZON DRIVE</h1><p>Wide open roads. Sunset mountains. Arcade racing.</p><p>Choose your line, hit nitro and carve through the highway.</p><button class="start" id="go">START DRIVING</button><p class="hint">Touch controls or WASD / arrow keys · Landscape recommended</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game');let scene=new THREE.Scene();scene.background=new THREE.Color(0x8bbce8);scene.fog=new THREE.Fog(0x9bbfe1,100,650);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);camera.position.set(0,6,-12);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd6edff,0x52613e,2));const sun=new THREE.DirectionalLight(0xffedcf,3.2);sun.position.set(-80,100,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshStandardMaterial({color:0x607b49}));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;ground.receiveShadow=true;scene.add(ground);
// Winding track ribbon
const pts=[];for(let i=0;i<260;i++){let t=i/260*Math.PI*2;pts.push(new THREE.Vector3(Math.sin(t)*95+Math.sin(t*2)*14,0,Math.cos(t)*145));}const path=new THREE.CatmullRomCurve3(pts,true);const roadWidth=15;const roadGeo=new THREE.BufferGeometry();let verts=[],uv=[],idx=[];const segs=1100;for(let i=0;i<=segs;i++){let t=i/segs,p=path.getPointAt(t),tan=path.getTangentAt(t);let side=new THREE.Vector3(-tan.z,0,tan.x).normalize();verts.push(p.x-side.x*roadWidth/2,.03,p.z-side.z*roadWidth/2,p.x+side.x*roadWidth/2,.03,p.z+side.z*roadWidth/2);uv.push(0,t*100,1,t*100);if(i<segs){let a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));roadGeo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));roadGeo.setIndex(idx);roadGeo.computeVertexNormals();let road=new THREE.Mesh(roadGeo,new THREE.MeshStandardMaterial({color:0x242a31,roughness:.8}));road.receiveShadow=true;scene.add(road);
// edges and broken center dashes as repeated strips along curve
function strip(offset,width,color){let g=new THREE.BufferGeometry(),v=[],id=[];for(let i=0;i<=segs;i++){let t=i/segs,p=path.getPointAt(t),tan=path.getTangentAt(t),s=new THREE.Vector3(-tan.z,0,tan.x).normalize();v.push(p.x+s.x*(offset-width/2),.07,p.z+s.z*(offset-width/2),p.x+s.x*(offset+width/2),.07,p.z+s.z*(offset+width/2));if(i<segs){let n=i*2;id.push(n,n+1,n+2,n+1,n+3,n+2)}}g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(id);g.computeVertexNormals();scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide})));}strip(-7.1,.22,0x62f0ff);strip(7.1,.22,0x62f0ff);strip(0,.12,0xf4f4e8);
// roadside posts, rocks, trees, signs and distant mountains
function box(x,y,z,sx,sy,sz,col){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:col,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m}
for(let i=0;i<360;i++){let t=i/360,p=path.getPointAt(t),tan=path.getTangentAt(t),side=new THREE.Vector3(-tan.z,0,tan.x).normalize();for(let sign of [-1,1]){let q=p.clone().addScaledVector(side,sign*(11+Math.random()*18));if(Math.random()<.55){let trunk=box(q.x,.8,q.z,.45,1.6,.45,0x59432b);let crown=new THREE.Mesh(new THREE.ConeGeometry(2.3,5,7),new THREE.MeshStandardMaterial({color:Math.random()>.5?0x316747:0x527f42}));crown.position.set(q.x,3.4,q.z);crown.castShadow=true;scene.add(crown)}else{box(q.x,.8,q.z,1.2,1.5,1.2,0x7c8b88);box(q.x,1.8,q.z,1.3,.25,.2,0xffe56d)}}}
// skyline silhouettes
for(let i=0;i<90;i++){let x=(Math.random()-.5)*600,z=250+Math.random()*240,h=12+Math.random()*60;let b=box(x,h/2,z,8+Math.random()*14,h,8+Math.random()*14,0x52647c);for(let k=0;k<15;k++){let win=box(x+(Math.random()-.5)*7,h*Math.random(),z+7,0.5,0.7,.1,0xffc96a);win.material.emissive=new THREE.Color(0xffa83d);win.material.emissiveIntensity=.6}}
// procedural sportscar with imported-model picker (GLB support)
const car=new THREE.Group();const paint=new THREE.MeshPhysicalMaterial({color:0x0b9cf4,metalness:.75,roughness:.2,clearcoat:1});const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.65,4.3),paint);body.position.y=.85;body.castShadow=true;car.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.75,1.9),new THREE.MeshPhysicalMaterial({color:0x142636,metalness:.4,roughness:.16}));cabin.position.set(0,1.45,-.15);car.add(cabin);let hood=new THREE.Mesh(new THREE.BoxGeometry(1.9,.22,1.1),paint);hood.position.set(0,1.15,1.25);car.add(hood);let bumper=new THREE.Mesh(new THREE.BoxGeometry(2,.25,.3),new THREE.MeshStandardMaterial({color:0x11151a,metalness:.7}));bumper.position.set(0,.48,2.12);car.add(bumper);let wheels=[];for(let x of [-1.05,1.05])for(let z of [-1.35,1.4]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.32,20),new THREE.MeshStandardMaterial({color:0x101216,roughness:.8}));w.rotation.z=Math.PI/2;w.position.set(x,.5,z);w.castShadow=true;car.add(w);wheels.push(w)}let headmat=new THREE.MeshBasicMaterial({color:0xb8f8ff});for(let x of [-.65,.65]){let h=new THREE.Mesh(new THREE.BoxGeometry(.45,.12,.12),headmat);h.position.set(x,1,2.08);car.add(h)}car.position.set(0,0,0);scene.add(car);
let imported=null;const picker=document.createElement('input');picker.type='file';picker.accept='.glb,.gltf';picker.style.display='none';document.body.appendChild(picker);let modelBtn=document.createElement('button');modelBtn.textContent='LOAD 3D CAR';modelBtn.className='pill';modelBtn.style.cssText='position:absolute;top:58px;right:20px;pointer-events:auto;';document.querySelector('#hud').appendChild(modelBtn);modelBtn.onclick=()=>picker.click();picker.onchange=async()=>{let file=picker.files[0];if(!file)return;let url=URL.createObjectURL(file);try{let {GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js');let loader=new GLTFLoader();loader.load(url,g=>{if(imported)car.remove(imported);imported=g.scene;let bb=new THREE.Box3().setFromObject(imported),size=bb.getSize(new THREE.Vector3()),scale=3.8/Math.max(size.x,size.z);imported.scale.setScalar(scale);bb.setFromObject(imported);imported.position.y=-bb.min.y;car.add(imported);body.visible=false;cabin.visible=false;hood.visible=false;wheels.forEach(w=>w.visible=false);URL.revokeObjectURL(url)},undefined,e=>alert('Could not load model. Use a valid GLB.'));}catch(e){alert('GLB loader unavailable.')}};
// dynamic neon nitro streaks
let streaks=[];const streakMat=new THREE.MeshBasicMaterial({color:0x54dfff,transparent:true,opacity:.5});for(let i=0;i<70;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(.025,.025,Math.random()*5+2),streakMat);m.visible=false;scene.add(m);streaks.push(m)}
let progress=.01,steer=0,speed=0,nitro=100,dist=0,elapsed=0,active=false,boosting=false,braking=false,keys={};let clock=new THREE.Clock();function setKey(k,v){keys[k]=v}window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function bind(id,k){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();setKey(k,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>setKey(k,false)))}bind('left','left');bind('right','right');bind('brake','brake');bind('boost','boost');
function curvePosition(t){return path.getPointAt(((t%1)+1)%1)}function update(dt){if(!active)return;elapsed+=dt;let accelerate=keys.w||keys.arrowup,reverse=keys.s||keys.arrowdown;braking=keys.brake;boosting=keys.boost&&nitro>0&&speed>30;if(accelerate)speed+=36*dt;else speed-=9*dt;if(reverse||braking)speed-=50*dt;if(boosting){speed+=65*dt;nitro-=22*dt}else nitro=Math.min(100,nitro+8*dt);speed=Math.max(0,Math.min(boosting?310:235,speed));let target=(keys.left||keys.a)?-1:(keys.right||keys.d)?1:0;steer+=(target-steer)*Math.min(1,dt*5);progress+=(speed/3.6)*dt/420;dist+=(speed/3.6)*dt/1000;let p=curvePosition(progress),tan=path.getTangentAt(((progress%1)+1)%1),side=new THREE.Vector3(-tan.z,0,tan.x).normalize();let offset=steer*5.1;p.addScaledVector(side,offset);car.position.copy(p);car.position.y=.02;car.rotation.y=Math.atan2(tan.x,tan.z)+steer*.25;car.rotation.z=-steer*.08;wheels.forEach(w=>w.rotation.x-=speed*dt/5);let look=curvePosition(progress+.012);look.addScaledVector(side,steer*4);camera.position.lerp(new THREE.Vector3(p.x-tan.x*11,5.5,p.z-tan.z*11),Math.min(1,dt*3));camera.lookAt(look.x,1.3,look.z);camera.fov=boosting?83:70;camera.updateProjectionMatrix();streaks.forEach((m,i)=>{m.visible=boosting;m.position.set(p.x+(Math.random()-.5)*25,p.y+Math.random()*5,p.z-20-Math.random()*40)});document.querySelector('#speed').textContent=String(Math.round(speed)).padStart(3,'0');document.querySelector('#distance').textContent=dist.toFixed(1)+' km';document.querySelector('#nitroTxt').textContent=Math.round(nitro)+'%';document.querySelector('#nitroBar').style.width=nitro+'%';document.querySelector('#clock').textContent=new Date(elapsed*1000).toISOString().slice(14,19);}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#go').onclick=async()=>{active=true;document.querySelector('#start').classList.add('hidden');try{await screen.orientation.lock('landscape')}catch{}};
</script></body></html>
